name: cometchat_chat_uikit
description: CometChat's Flutter UI Kit offers custom UI components for streamlined text and chat features in your app, designed with developers in mind to minimize development effort.
version: 6.1.1
homepage: https://www.cometchat.com/
repository: https://github.com/cometchat/chat-uikit-flutter
issue_tracker: https://github.com/cometchat/chat-uikit-flutter/issues
topics:
  - chat
  - messaging
  - chat-ui
  - cometchat
  - uikit
screenshots:
  - description: "CometChat Flutter UI Kit components: conversations, messages, and calls."
    path: screenshots/overview_cometchat_screens.png

environment:
  sdk: '>=3.10.8 <4.0.0'
  flutter: ">=3.38.9"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  intl: ^0.20.2
  path_provider: ^2.1.2
  webview_flutter: ^4.13.0
  url_launcher: ^6.3.2
  cometchat_sdk: ^5.0.7
  cometchat_cards: ^1.0.1
  video_player: ^2.10.1
  http: ^1.4.0
  image_picker: ^1.2.1
  image_picker_android: ^0.8.13
  image_picker_platform_interface: ^2.11.1
  flutter_svg: ^2.2.2
  flutter_cache_manager: ^3.4.1
  cached_network_image: ^3.4.1
  cometchat_calls_sdk: ^5.0.4
  permission_handler: ^12.0.0
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8
  diffutil_dart: ^5.0.0
  scrollview_observer: ^1.27.0
  gpt_markdown: ^1.1.2
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
      sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.3
  bloc_test: ^10.0.0
  network_image_mock: ^2.1.1
  glados: ^1.1.7
  alchemist: ^0.14.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:
  generate: true
  plugin:
    platforms:
      android:
        package: com.cometchat.cometchat_chat_uikit
        pluginClass: CometchatChatUikitPlugin
      ios:
        pluginClass: CometchatChatUikitPlugin
      web:
        pluginClass: CometchatChatUikitPluginWeb
        fileName: cometchat_chat_uikit_web.dart

  # To add assets to your plugin package, add an assets section, like this:
#  assets:
#    - assets/sound/
#    - assets/icons/
#    - assets/icons/2x/

  # To add custom fonts to your plugin package, add a fonts section here,
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic

  assets:
    - assets/sound/
    - assets/icons/
    - assets/icons/2x/
    - assets/icons/light/
    - assets/icons/dark/
    - assets/icons/svg/calls/
    - assets/icons/svg/attachments/
