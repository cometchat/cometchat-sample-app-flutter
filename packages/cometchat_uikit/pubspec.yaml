name: cometchat_chat_uikit
description: CometChat's Flutter UI Kit offers custom UI components for streamlined text and chat features in your app, designed with developers in mind to minimize development effort.
version: 6.0.0-beta3
homepage: https://www.cometchat.com/
publish_to: none

environment:
  sdk: '>=2.17.0 <4.0.0'
  flutter: ">=2.5.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  intl: any
  path_provider: ^2.1.2
  webview_flutter: ^4.4.3
  url_launcher: ^6.1.12
  cometchat_sdk: ^4.1.2
  video_player: ^2.7.2
  http: ^1.0.0
  image_picker: ^1.0.5
  flutter_svg: ^2.0.17
  flutter_cache_manager: ^3.4.1
  cached_network_image: ^3.3.1
  cometchat_calls_sdk:
    hosted: https://dart.cloudsmith.io/cometchat/cometchat/
    version: ^5.0.0-beta.3
  permission_handler: ^11.3.1
  flutter_bloc: ^8.1.0
  equatable: ^2.0.5
  diffutil_dart: ^3.0.0
  scrollview_observer: ^1.23.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
      sdk: flutter
  flutter_lints: ^2.0.0
  mocktail: ^1.0.3
  bloc_test: ^9.1.0
  network_image_mock: ^2.1.1


# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:
  generate: true
  plugin:
    platforms:
      android:
        package: com.cometchat.cometchat_chat_uikit
        pluginClass: CometchatChatUikitPlugin
      ios:
        pluginClass: CometchatChatUikitPlugin

  # To add assets to your plugin package, add an assets section, like this:
#  assets:
#    - assets/sound/
#    - assets/icons/
#    - assets/icons/2x/

  # To add custom fonts to your plugin package, add a fonts section here,
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic

  assets:
    - assets/sound/
    - assets/icons/
    - assets/icons/2x/
    - assets/icons/light/
    - assets/icons/dark/
    - assets/icons/svg/calls/